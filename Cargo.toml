[workspace]
# `klu-sys` compiles the SuiteSparse submodule at `crates/klu-sys/SuiteSparse`
# (or a checkout pointed at by `KLUJAX_SUITESPARSE_DIR`). It is a normal member,
# but building `klujax-ffi` alone pulls it in as a dependency.
default-members = ["crates/klujax-ffi"]
members = ["crates/klu", "crates/klu-sys", "crates/klujax-ffi", "crates/klujax-ffi-macros"]
resolver = "2"

[workspace.lints.clippy]
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"

# Rust hardening lints (see work.md). `unsafe_op_in_unsafe_fn` is already clean.
# The clippy doc lints are `deny`; modules carrying pre-existing backlog opt out
# with a `#![allow(...)]` + TODO that later stages remove.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.package]
edition = "2021"
license = "LGPL-2.1"
version = "0.5.2"
